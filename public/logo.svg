<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M256 36 L430 96 C430 260 360 380 256 460 C152 380 82 260 82 96 Z" 
        fill="url(#shieldGrad)" stroke="#1e3a5f" stroke-width="12" />

  <!-- Radar Scanning Arc -->
  <path d="M170 170 A120 120 0 0 1 342 170" fill="none" stroke="url(#blueGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="10 8" />
  <path d="M140 140 A160 160 0 0 1 372 140" fill="none" stroke="url(#blueGrad)" stroke-width="4" opacity="0.2" />

  <!-- Semi-Truck Cab Vector Icon -->
  <g transform="translate(156, 175)" filter="url(#glow)">
    <!-- Truck Cab Body -->
    <path d="M25 150 L25 50 L100 50 L140 90 L175 90 L175 150 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="6"/>
    <!-- Windshield -->
    <path d="M102 58 L134 90 L85 90 L85 58 Z" fill="#0284c7" opacity="0.8"/>
    <!-- Front Grill / Chrome -->
    <rect x="155" y="100" width="20" height="42" rx="4" fill="url(#amberGrad)"/>
    <line x1="160" y1="108" x2="170" y2="108" stroke="#78350f" stroke-width="2"/>
    <line x1="160" y1="116" x2="170" y2="116" stroke="#78350f" stroke-width="2"/>
    <line x1="160" y1="124" x2="170" y2="124" stroke="#78350f" stroke-width="2"/>
    <line x1="160" y1="132" x2="170" y2="132" stroke="#78350f" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="55" cy="150" r="22" fill="#0f172a" stroke="#64748b" stroke-width="5"/>
    <circle cx="55" cy="150" r="9" fill="url(#amberGrad)"/>
    <circle cx="145" cy="150" r="22" fill="#0f172a" stroke="#64748b" stroke-width="5"/>
    <circle cx="145" cy="150" r="9" fill="url(#amberGrad)"/>
    <!-- Exhaust Stack -->
    <rect x="35" y="24" width="8" height="35" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Safety Verified Checkmark Badge -->
  <g transform="translate(256, 385)">
    <circle cx="0" cy="0" r="42" fill="#064e3b" stroke="#10b981" stroke-width="6" filter="url(#glow)"/>
    <path d="M-16 -2 L-6 10 L18 -12" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

